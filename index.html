<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>العبارة للتجارة والتوريدات (v2)</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0B1F4D" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Apple Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="العبارة" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

      body {
        font-family: 'Cairo', sans-serif;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes fadeInScale {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 1s ease-in-out forwards;
      }

      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      .animate-fadeInScale {
        animation: fadeInScale 1.5s ease-in-out forwards;
      }

      @media print {
        body * {
          visibility: hidden;
        }

        #print-area,
        #print-area * {
          visibility: visible;
        }

        #print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }

        @page {
          size: A4;
          margin: 20mm;
        }

        body {
          background-color: #fff;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Redirect to v=2 to force network fetch (bypass internal cache)
      const url = new URL(window.location.href);
      if (!url.searchParams.has('v')) {
        url.searchParams.set('v', '2');
        window.location.href = url.toString();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((registration) => {
              // لو SW جديد في انتظار التفعيل — فعّله فوراً (تحديث فوري)
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
          // لما SW جديد ياخد التحكم — اعمل reload مرة واحدة (الكاش القديم يتشال)
          let refreshed = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshed && window.sessionStorage.getItem('sw_v3_done') !== '1') {
              refreshed = true;
              window.sessionStorage.setItem('sw_v3_done', '1');
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
